[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "repairgate"
version = "0.2.0"
description = "A test-gated local code repair assistant with protected tests and replayable decisions."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0"]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
[project.scripts]
repairgate = "repairgate.cli:main"
[tool.setuptools.packages.find]
include = ["repairgate*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
